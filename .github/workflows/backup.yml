- name: Create DB snapshot
  env:
    SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  run: |
    echo "📦 Creating database dump..."
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    
    # Извлекаем компоненты из connection string
    DB_HOST=$(echo "$SUPABASE_DB_URL" | grep -oP '@\K[^:/]+')
    DB_PORT=$(echo "$SUPABASE_DB_URL" | grep -oP ':\K[0-9]+(?=/)')
    DB_NAME=$(echo "$SUPABASE_DB_URL" | grep -oP '/\K[^?]+')
    DB_USER=$(echo "$SUPABASE_DB_URL" | grep -oP 'postgres://\K[^:]+')
    DB_PASS=$(echo "$SUPABASE_DB_URL" | grep -oP ':[^@]+@' | tr -d ':@')
    
    # Создаём дамп с явными параметрами
    PGPASSWORD="$DB_PASS" pg_dump \
      -h "$DB_HOST" \
      -p "$DB_PORT" \
      -U "$DB_USER" \
      -d "$DB_NAME" \
      -F c \
      -f "fromto_backup_${TIMESTAMP}.dump"
    
    echo "BACKUP_FILE=fromto_backup_${TIMESTAMP}.dump" >> $GITHUB_ENV
    echo "✅ Dump created: fromto_backup_${TIMESTAMP}.dump"
